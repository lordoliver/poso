name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: poso-ng/package-lock.json
      
      - name: Install dependencies
        working-directory: poso-ng
        run: npm ci
      
      - name: Build
        working-directory: poso-ng
        run: npm run build -- --base-href=/poso/
      
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: poso-ng/dist/poso-ng/browser
